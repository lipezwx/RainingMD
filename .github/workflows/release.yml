name: Build installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Build installer
        shell: cmd
        env:
          PYTHON_SPEC: -3.13-64
        run: build.bat
      - name: Name the asset
        shell: pwsh
        run: Copy-Item dist_installer\rainingmd-installer.exe dist_installer\installer.exe
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist_installer/installer.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist_installer/installer.exe
          generate_release_notes: true
